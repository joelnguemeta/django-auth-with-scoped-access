repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff
        name: ruff (uv)
        entry: uv run --group lint -- ruff check --preview --force-exclude
        language: system
        types_or: [python, pyi]
        exclude: '^(migrations/|example/migrations/)'
      - id: ruff-format
        name: ruff-format (uv)
        entry: uv run --group lint -- ruff format --preview --force-exclude
        language: system
        types_or: [python, pyi]
        exclude: '^(migrations/|example/migrations/)'
