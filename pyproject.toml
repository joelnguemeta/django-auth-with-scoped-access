[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-scoped-access"
version = "0.1.0.dev0"
description = "RBAC + hierarchical scope-based authorization (ABAC) + step-up re-authentication for Django. Reference implementation of the Scoped Access specification."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "PSE" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["Django>=4.2"]

[project.optional-dependencies]
drf = ["djangorestframework>=3.14"]

[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4.8", "djangorestframework>=3.14"]

[tool.hatch.build.targets.wheel]
packages = ["scoped_access"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
