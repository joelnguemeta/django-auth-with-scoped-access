[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-scoped-access"
version = "0.1.0"
description = "RBAC + hierarchical scope-based authorization (ABAC) + step-up re-authentication for Django. Reference implementation of the Scoped Access specification."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joel Edmond Nguemeta" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["Django>=4.2"]

[project.optional-dependencies]
drf = ["djangorestframework>=3.14"]

[dependency-groups]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.28",
]
dev = [
    "pytest>=8",
    "pytest-django>=4.8",
    "djangorestframework>=3.14",
    "djangorestframework-stubs>=3.17.0",
    "djangorestframework-simplejwt>=5.5.1",
]

[tool.hatch.build.targets.wheel]
packages = ["scoped_access"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
